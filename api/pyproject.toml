[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "productsearcher-api"
version = "0.1.0"
description = "ProductSearcher API (FastAPI, monólito modular)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "alembic>=1.14",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

# Busca vetorial (ADR-010 D3). Extra, e não dependência obrigatória, pelo mesmo
# motivo do extra `ai` do worker: a IA é complementar neste projeto, e a API tem
# de continuar instalável e funcional sem nada de inferência — com
# `vector_enabled=false` o FTS serve sozinho e estes pacotes nem são importados.
#
# `onnxruntime` e não `torch`: é a alavanca (1) do ADR-010 D3.2, medida em
# D3.3 — mesma dimensão e mesmo modelo, com 739 MB de imagem em vez de 2546 MB.
# O torch aparece só no estágio de export do Dockerfile e não vai para produção.
vector = ["onnxruntime>=1.17", "transformers>=4.40", "numpy>=1.26"]

# Pacote da aplicação (exclui tests/ da distribuição).
[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
