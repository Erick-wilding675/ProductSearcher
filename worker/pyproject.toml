[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "productsearcher-worker"
version = "0.1.0"
description = "ProductSearcher — worker de ingestão do catálogo seed"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# Só o rotulador de `use_case` (ADR-010 D2) precisa do SDK, e ele é um passo
# offline avulso. Fora do conjunto obrigatório para a ingestão continuar
# instalável sem nenhuma dependência de IA — princípio fundacional do projeto.
# >=0.125: o rotulador manda `output_config.format` (structured outputs), que o
# SDK precisa conhecer para montar a requisição. 0.125.0 é a versão em que isso
# foi verificado; o >=0.40 anterior era o piso de quando o arquivo foi escrito e
# aceitaria um SDK que descarta o parâmetro em silêncio.
ai = ["anthropic>=0.125"]

# Pacote de ingestão (seed/ é dado, não entra na distribuição).
[tool.setuptools]
packages = ["ingestion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
