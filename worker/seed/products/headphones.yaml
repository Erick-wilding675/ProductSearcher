    \ PS4 e PS5 Conectividade via Dongle USB Wireless\r\nXbox One e Series S e X Conectividade via cabo\
    \ P3 no Controle\r\n\r\nPor que escolher o Onikuma GT808?\r\n\r\nPorque ele une os principais recursos\
