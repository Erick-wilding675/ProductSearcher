    \n\r\nEm consoles, o uso pode depender do modo de conexão compatível, como receptor 2.4GHz ou cabo\
    \ P3 conectado ao controle, conforme o modelo do aparelho.\r\n\r\nFicha técnica\r\nMarca: Onikuma\r\
