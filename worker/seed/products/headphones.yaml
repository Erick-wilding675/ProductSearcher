    \ moderno, agressivo e gamer, ideal para quem quer deixar o setup mais bonito e completo.\r\n\r\n\
    Conforto para longas sessões de uso\r\nPossui estrutura pensada para uso prolongado, com arco ajustável\
    \ e almofadas confortáveis, ajudando a reduzir o incômodo durante partidas, estudos ou trabalho.\r\
    \n\r\nIndicado para\r\nJogos online\r\nPS5, PS4, Xbox, PC, notebook e celular, conforme o modo de\
    \ conexão compatível\r\nChamadas online\r\nAulas e reuniões\r\nMúsicas, vídeos e filmes\r\nUso gamer\
    \ e casual no dia a dia\r\nAtenção sobre compatibilidade\r\n\r\nAntes da compra, verifique o modo\
    \ de conexão ideal para o seu aparelho. O headset pode ser utilizado via 2.4GHz, Bluetooth ou cabo\
