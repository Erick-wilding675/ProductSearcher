    \nO modo sem fio permite uma experiência mais confortável, deixando seu setup mais organizado e livre\
    \ de cabos durante o uso.\r\n\r\nSom imersivo para jogos, vídeos e músicas\r\nCom driver de 40 mm,\
    \ o headset entrega uma experiência sonora mais envolvente, ideal para ouvir melhor os detalhes das\
