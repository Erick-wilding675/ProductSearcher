  model: Quantum 650
  description: 'O Quantum 650 foi desenvolvido para jogadores que buscam áudio preciso, conforto prolongado
    e liberdade sem fio. Equipado com drivers dinâmicos de carbono de 50 mm, o fone gamer entrega som
    potente e com baixa distorção para reproduzir cada detalhe da gameplay com clareza, desde passos discretos
    até explosões impactantes.


    A tecnologia JBL Quantum Spatial Sound proporciona uma experiência sonora mais natural e realista,
    processando reflexos e reverberações para ajudar a identificar a direção dos sons com maior precisão.
    O resultado é mais imersão em campanhas cinematográficas e mais percepção espacial em partidas competitivas.


    A conexão sem fio dupla combina Bluetooth 5.3 e tecnologia wireless de 2,4 GHz de baixa latência,
    oferecendo estabilidade e flexibilidade para diferentes plataformas e formas de uso. O design ultraleve
    desse fone over ear, com rede de malha respirável e almofadas em tecido macio, proporciona conforto
    durante longas sessões de jogo.


    O microfone boom cardioide removível com cancelamento de ruído ajuda a manter a comunicação clara
    com sua equipe, enquanto os componentes substituíveis, como microfone, rede e almofadas, aumentam
    a durabilidade e facilitam a manutenção do produto.


    Com até 45 horas de bateria e compatibilidade multiplataforma, o Quantum 650 combina desempenho, conforto
    e versatilidade para acompanhar você em qualquer desafio.'
