  model: LUMVA-SK19
  description: 'Atenção:

    Observação: se apenas um fone de ouvido produzir som ao receber, isso pode indicar que o emparelhamento
    não foi bem-sucedido. Execute as seguintes etapas:

    1. Remova o nome de emparelhamento Bluetooth antigo do dispositivo do seu celular (esta etapa é crucial).
    Coloque os dois fones de ouvido no estojo de carregamento, feche a tampa e remova-os simultaneamente.

    2. Remova os dois fones de ouvido e coloque-os sobre uma superfície ou insira-os nos ouvidos. As luzes
    dos dois fones de ouvido piscarão alternadamente. Aguarde de 10 a 30 segundos, durante os quais os
    fones de ouvido entrarão no modo de pesquisa automática (seja paciente). Quando o emparelhamento for
    bem-sucedido, a luz de um fone de ouvido permanecerá acesa, enquanto a luz do outro fone de ouvido
    se apagará.

    3. Nesse momento, abra as configurações de Bluetooth do seu telefone e execute uma nova pesquisa.
    Quando os fones de ouvido Bluetooth aparecerem na lista de dispositivos disponíveis, selecione o nome
    do emparelhamento e clique em Conectar.


    1. Mini e pequeno: Os fones de ouvido invisíveis sem fio são confortáveis e sem estresse, e os fones
    de ouvido pesam apenas 0.1 onças, tornando-os ideais para pequenos canais auditivos. Quando você usa
    fones de ouvido escondidos no trabalho, é invisível e quase despercebido

    2. Projetado para dormir: Se você precisa ouvir música enquanto dorme, esses mini fones de ouvido
    invisíveis são uma boa escolha para você. Esses fones de ouvido para dormir são projetados para melhorar
    o conforto, para que você não sinta um objeto estranho ao dormir de lado e se encaixe melhor em seus
    ouvidos

    3. Bluetooth 5.3 e chamadas claras: Excelente redução de ruído físico combinada com tecnologia de
    redução de ruído acústico, o microfone dos fones de ouvido para dormir também pode reduzir o ruído
    em ambientes barulhentos, assim como conversas cara a cara, chamadas claras.

    4. Até 20 horas de duração da bateria e carregamento rápido: a bateria invisível dos fones de ouvido
    pode durar até 4 horas, a bateria do estojo pode durar até 16 horas e os fones de ouvido pequenos
    fornecem áudio durante todo o dia. Quando precisar de mais energia, você pode carregar rapidamente
    o estojo de carregamento em menos de uma hora

    5. Qualidade de som premium: esses fones de ouvido para dormir oferecem prazer de áudio de alta qualidade.
    Som surround estéreo oco de baleia para desfrutar de música envolvente

    6. Como emparelhar e desconectar o Bluetooth: Quando os mini fones de ouvido são retirados do estojo
    de carregamento, eles ligam automaticamente. Quando as luzes vermelha e azul piscam alternadamente,
    ele entra no estado de emparelhamento. Vá para a tela de configurações de Bluetooth do seu dispositivo
    e clique em "SK19" para concluir o emparelhamento. Ao emparelhar um novo dispositivo Bluetooth, você
    precisa desconectar o dispositivo Bluetooth anterior

    7. Problemas comuns - Não é possível carregar: 1. Limpe o interior da porta USB-C com uma escova seca
    de cerdas macias ou ar comprimido. 2. Você pode usar um cotonete embebido em uma pequena quantidade
    de água para limpar suavemente os contatos de metal dos fones de ouvido invisíveis (espere até que
    estejam completamente secos antes de usar)'
