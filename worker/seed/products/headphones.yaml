    - Conector de áudio: 3,5mm

    - Compatibilidade: Windows, macOS, Xbox, PlayStation, Nintendo Switch, Android, iOS


    Acessórios Inclusos


    - Cabo USB

    - Cabo de áudio 3,5mm

    - Adaptador de 3,5mm para 6,3mm

    - Manual de instruções


    Certificações


    - Certificações: CE, FCC, RoHS


    Três-Modo Gaming Headset: Experimente jogos imersivos com o novo headset de três modos Onikuma 2024.
    Ele foi projetado para melhorar sua experiência de jogo com qualidade de som superior e ajuste confortável.


    Vida Útil da Bateria Ultra Longa: Este headset possui uma duração de bateria ultra longa, garantindo
    áudio ininterrupto por horas a fio.


    Comunicação Sem Fio e Com Fio: Este headset oferece opções flexíveis de comunicação.


    Princípio de Vocalismo Dinâmico: O princípio de vocalismo dinâmico deste fone de ouvido proporciona
    um som nítido e rico.


    Material Plástico Durável: Construído em plástico durável, este fone de ouvido é projetado para suportar
    longas horas de uso.


    Unidade de Diafragma de Alta Qualidade de 40mm: Realça o volume baixo e os graves, destacando a textura
    da voz humana e proporcionando um som equilibrado.


    Modo de Jogo de Três Modos, Sem Atraso: Com cerca de 15 milissegundos de latência ultrabaixa e conexão
    estável sem fio de 2.4GHz, a tecnologia Bluetooth 5.3 garante uma experiência de jogo agradável.


    Alto Desempenho, Longa Duração da Bateria: Bateria de lítio de alta capacidade de 500mAh, com autonomia
    de até 25 horas.


    Microfone Oculto com Filtragem de Ruído Eficaz: Tecnologia embutida de redução de ruído, com microfone
    patenteado e oculto, garantindo comunicação clara em qualquer situação.


    Conectividade versátil e ampla compatibilidade: O design exclusivo de conexão 3 em 1 torna este fone
    de ouvido sem fio para jogos PS5 compatível com várias plataformas, incluindo PS5, controle PS4, PC,
    Mac, e Nintendo Switch (com microfone indisponível). Funciona com telefones e tablets, enquanto a
    série Xbox é compatível apenas no modo com fio.'
