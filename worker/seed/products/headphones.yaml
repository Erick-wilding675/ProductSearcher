    que você não precise se preocupar com recargas frequentes.


    Controle Prático

    O fone de ouvido Dapon H02D torna o controle de suas músicas e chamadas uma tarefa simples. Com apenas
    3 toques, você pode gerenciar suas faixas e atender chamadas com seu microfone integrado. Os botões
    de volume e atendimento de chamadas são facilmente acessíveis, tudo ao seu alcance.


