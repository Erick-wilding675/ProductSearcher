    O ASUS Vivobook S14 é feito para durar, inclusive ligado e longe da tomada. A bateria de 70 Wh garante
    autonomia para um dia inteiro de trabalho, podendo chegar a até 18 horas de reprodução de vídeos.
    Quando a energia acaba, é possível recuperar 60% da carga em apenas 49 minutos, graças à tecnologia
    de carregamento rápido via USB Tipo-C.

    Além da eficiência energética, o notebook alcançaalto desempenho em multitarefas, graças ao processador
    até Intel Core i7 13620H. Esse chip permite trabalhar, estudar e se divertir com diversos programas
    abertos ao mesmo tempo, de forma ágil e ininterrupta.


